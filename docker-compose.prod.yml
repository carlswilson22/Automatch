name: automatch-prod

services:
  # Database Service (PostgreSQL 15 - Producao)
  db:
    image: postgres:15-alpine
    container_name: automatch-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Sem portas expostas no host: isolamento total na rede interna
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - automatch-prod-network

  # Redis Service (Cache & Rate Limiting - Producao)
  redis:
    image: redis:7-alpine
    container_name: automatch-prod-redis
    restart: always
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes" ]
    # Sem portas expostas no host
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - automatch-prod-network

  # Backend Service (FastAPI / Python 3.11 - Producao com 4 Workers)
  backend:
    image: automatch-backend-prod:latest
    build:
      context: "./backend"
      dockerfile: Dockerfile
    container_name: automatch-prod-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PORT=8000
    # Execucao com multiplos workers para alta disponibilidade (sem reload)
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4" ]
    # Sem portas expostas no host
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automatch-prod-network

  # Frontend Service (Build Estatico SPA servido via Nginx Alpine)
  frontend:
    image: automatch-frontend-prod:latest
    build:
      context: "./frontend"
      dockerfile: Dockerfile.prod
    container_name: automatch-prod-frontend
    restart: always
    # Sem portas expostas no host
    depends_on:
      - backend
    networks:
      - automatch-prod-network

  # API Gateway (Nginx Reverse Proxy - Ponto Unico de Entrada Publica)
  gateway:
    image: automatch-gateway-prod:latest
    build:
      context: "./gateway"
      dockerfile: Dockerfile
    container_name: automatch-prod-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    networks:
      - automatch-prod-network

networks:
  automatch-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  backend_uploads:
