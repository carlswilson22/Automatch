# ==============================================================================
# docker-compose.prod.yml — Orquestração de containers para ambiente de produção.
#
# Objetivo e Motivo da Criação:
#   - Executa a stack de produção com volumes persistentes, Nginx gateway e backend otimizado.
# ==============================================================================
name: automatch-prod

services:
  # Database Service (PostgreSQL 15 - Producao)
  db:
    image: postgres:15-alpine
    container_name: automatch-prod-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Sem portas expostas no host: isolamento total na rede interna
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - automatch-prod-network

  # Backend Service (FastAPI / Python 3.11 - Producao com 4 Workers)
  backend:
    image: automatch-backend-prod:latest
    build:
      context: "./backend"
      dockerfile: Dockerfile
    container_name: automatch-prod-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PORT=8000
    # Execucao com multiplos workers para alta disponibilidade (sem reload)
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4" ]
    # Sem portas expostas no host
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - automatch-prod-network

  # Frontend Service (Build Estatico SPA servido via Nginx Alpine)
  frontend:
    image: automatch-frontend-prod:latest
    build:
      context: "./frontend"
      dockerfile: Dockerfile.prod
    container_name: automatch-prod-frontend
    restart: always
    # Sem portas expostas no host
    depends_on:
      - backend
    networks:
      - automatch-prod-network

  # API Gateway (Nginx Reverse Proxy - Ponto Unico de Entrada Publica)
  gateway:
    image: automatch-gateway-prod:latest
    build:
      context: "./gateway"
      dockerfile: Dockerfile
    container_name: automatch-prod-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - automatch-prod-network

networks:
  automatch-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
  backend_uploads:
