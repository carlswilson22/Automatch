name: automatch

services:
  # Database Service (PostgreSQL 15)
  db:
    image: postgres:15-alpine
    container_name: automatch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-automatch}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Restrito ao localhost (porta 5433 externa para evitar conflito com PostgreSQL local)
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-automatch}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - automatch-network

  # Redis Service (Cache, Rate Limiting & Messaging)
  redis:
    image: redis:7-alpine
    container_name: automatch-redis
    restart: unless-stopped
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_dev_secret}", "--appendonly", "yes" ]
    ports:
      # Restrito ao localhost com autenticacao ativa
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_secret}", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - automatch-network

  # Backend Service (FastAPI / Python 3.11 - Perfil de Desenvolvimento)
  backend:
    image: automatch-backend:latest
    build:
      context: "./backend"
      dockerfile: Dockerfile
    container_name: automatch-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-automatch}}
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD:-redis_dev_secret}@redis:6379/0}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-automatch_dev_jwt_secret_key_change_me_in_prod}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - PORT=8000
    command: [ "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    ports:
      # Restrito ao localhost para documentacao Swagger direta
      - "127.0.0.1:8000:8000"
    volumes:
      - "./backend:/app"
      - "./backend/uploads:/app/uploads"
      - "./frontend/public/images:/app/public_images:ro"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - automatch-network

  # Frontend Service (React 18 / Vite SPA - Perfil de Desenvolvimento)
  frontend:
    image: automatch-frontend:latest
    build:
      context: "./frontend"
      dockerfile: Dockerfile
    container_name: automatch-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - "./frontend:/app"
      - "/app/node_modules"
    environment:
      - VITE_API_URL=/api
    depends_on:
      - backend
    networks:
      - automatch-network

  # Central API Gateway (Nginx Reverse Proxy)
  gateway:
    image: automatch-gateway:latest
    build:
      context: "./gateway"
      dockerfile: Dockerfile
    container_name: automatch-gateway
    restart: unless-stopped
    ports:
      # Ponto unico de entrada HTTP para navegadores
      - "80:80"
      - "3000:80"
    depends_on:
      - backend
      - frontend
    networks:
      - automatch-network

networks:
  automatch-network:
    driver: bridge

volumes:
  postgres_data:
