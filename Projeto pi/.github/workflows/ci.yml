name: ProjetoPI CI

# O fluxo será ativado sempre que alguém fizer um Pull Request para a branch principal
on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. VERIFICAÇÃO DO BACKEND (PYTHON)
  testar-backend:
    name: Testar Backend Python
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Mude para a versão que você usa

      - name: Instalar dependências do Python
        run: |
          python -m pip install --upgrade pip
          # Descomente a linha abaixo e ajuste o caminho se seu requirements.txt estiver em uma pasta
          # pip install -r requirements.txt 

      - name: Rodar testes do Backend
        run: |
          echo "Aqui rodariam os testes Python (ex: pytest)"
          # python -m pytest

  # 2. VERIFICAÇÃO DO FRONTEND (REACT + VITE + TAILWIND)
  testar-frontend:
    name: Testar Frontend React
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Mude para a versão do Node que você usa

      - name: Instalar dependências (criando o node_modules na nuvem)
        # Se o seu frontend estiver dentro de uma pasta (ex: /frontend), use "cd frontend && npm install"
        run: npm install

      - name: Testar o Build do Vite
        # Garante que o Vite e o Tailwind conseguem compilar o projeto sem erros
        run: npm run build

  # 3. VERIFICAÇÃO DO DOCKER (Opcional, mas recomendado)
  testar-docker:
    name: Testar Build do Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Tentar montar a imagem Docker
        # Se você usa docker-compose, pode testar com: docker compose build
        run: |
          echo "Verificando se as configurações do Docker estão corretas..."
          # docker build -t meubackend .