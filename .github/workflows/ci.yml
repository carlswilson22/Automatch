name: ProjetoPI CI & Quality Gate

# Ativado em push direto e Pull Requests para as branches principais e de homologação
on:
  push:
    branches: [ "main", "master", "ceub-main" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. VERIFICAÇÃO DO BACKEND (PYTHON & AUDITORIA DE REGRESSÃO)
  testar-backend:
    name: Bateria de Testes Backend (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências do Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Executar Bateria Completa de Testes de Regressão (9 Cenários)
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:////tmp/ci_audit_test.db"
        run: |
          python -m unittest test_audit_full_battery.py

  # 2. VERIFICAÇÃO DO FRONTEND (REACT + VITE + TAILWIND)
  testar-frontend:
    name: Build & Lint Frontend (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Testar o Build de Produção do Vite
        working-directory: ./frontend
        run: npm run build

  # 3. VERIFICAÇÃO DO DOCKER
  testar-docker:
    name: Validação de Build do Container Docker
    runs-on: ubuntu-latest
    needs: [testar-backend, testar-frontend]
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Validar Build da Imagem Backend
        run: |
          docker build -t automatch-backend:ci ./backend