name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    if: github.repository == 'carlswilson22/Automatch' || github.repository == 'CAMPUSCEUB/ADS-AUTOMATCH'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Setup Pages
        id: pages
        if: github.repository == 'carlswilson22/Automatch' || github.repository == 'CAMPUSCEUB/ADS-AUTOMATCH'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npm run build
          cp -n dist/index.html dist/404.html || true

      - name: Upload Pages Artifact
        if: github.repository == 'carlswilson22/Automatch' || github.repository == 'CAMPUSCEUB/ADS-AUTOMATCH'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    name: Deploy to GitHub Pages
    if: github.repository == 'carlswilson22/Automatch' || github.repository == 'CAMPUSCEUB/ADS-AUTOMATCH'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
