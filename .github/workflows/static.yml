# ==============================================================================
# .github/workflows/static.yml — Pipeline de Deploy Contínuo (CD) no GitHub Pages.
#
# Objetivo e Motivo da Criação:
#   - Compila o frontend do Automatch e faz o deploy automatizado para a visualização pública
#     estática no GitHub Pages somente por acionamento manual autorizado.
# ==============================================================================
name: Publicar demonstracao no Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Frontend
    if: github.repository == 'carlswilson22/Automatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Validar frontend antes da publicação
        working-directory: ./frontend
        run: |
          npm run lint
          npm test

      - name: Setup Pages
        id: pages
        if: github.repository == 'carlswilson22/Automatch'
        uses: actions/configure-pages@v5

      - name: Build frontend
        working-directory: ./frontend
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_DEMO_MODE: "true"
        run: |
          npm run build

      - name: Upload Pages Artifact
        if: github.repository == 'carlswilson22/Automatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

  deploy:
    name: Deploy to GitHub Pages
    if: github.repository == 'carlswilson22/Automatch'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
